[runtime]
sampler = nautilus
verbosity = standard
resume = T

[pipeline]
modules =  consistency  camb
            ;sample_rdh
            desi
timing=F
extra_output = distances/rs_zdrag distances/h0rd
values = examples/desi-values.ini

[nautilus]
n_live = 1000
verbose = T
resume = T

; you can set this to T if you don't want 
privacy = F

[emcee]
walkers = 32
samples = 300
nsteps = 10

[metropolis]
cobaya = T
samples = 50000
tuning_frequency = 500
tuning_grace = 1000
tuning_end = 10000
nsteps = 1000

[maxlike]
max_posterior = T

[test]
save_dir=output/desi
fatal_errors=T

[output]
filename = output/chains/desi-dr2-largepriors.txt

[sample_rdh]
file = utility/rescale_distances_rdh/rescale_distances_rdh.py

[consistency]
file = utility/consistency/consistency_interface.py

[camb]
file = boltzmann/camb/camb_interface.py
mode = background
feedback = 0
AccuracyBoost = 1.0
zmin_background = 0.
zmax_background = 3.
nz_background = 301
use_ppf_w = T
want_chistar = F

[desi]
file = likelihood/bao/desi-dr2/desi_dr2.py
desi_data_sets = all
