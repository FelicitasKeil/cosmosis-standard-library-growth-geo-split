[runtime]
sampler = nautilus
root = ${PWD}
resume=T
verbosity = standard

[emcee]
walkers = 32
samples = 300
nsteps = 10

[output]
filename = output/chains/pantheon_plus-lprior.txt
format = text

[pipeline]
modules = consistency astropy pantheon_plus
values = examples/pantheon_plus_values.ini
extra_output = cosmological_parameters/omega_lambda data_vector/2pt_chi2
debug=F
timing=F
; It's worth switching this to T when sampling using multinest, polychord,
; or other samplers that can take advantage of differences in calculation speeds between
; different parameters.
fast_slow = T

[test]
save_dir=output/pantheon_plus

[nautilus]
n_live = 2000
verbose = T
resume = True

; you can set this to T if you don't want 
privacy = F

; astropy is fast but can only compute background quantities.
; so we would need to switch to camb if we wanted to combine
; pantheon with other data.
[astropy]
file = background/astropy_background/astropy_background.py
model = lambdacdm
nz = 300
zmax = 3.0

[pantheon_plus]
file = likelihood/pantheon_plus/pantheon_plus_shoes.py
likelihood_only = T
include_shoes = F

[consistency]
file = utility/consistency/consistency_interface.py
