[runtime]
sampler = nautilus
verbosity = standard
resume = True

; WARNING: Some of these likelihoods have data in common.
; You shouldn't use them all in a real pipeline - this is just for testing
[pipeline]
modules =  consistency_split  camb_split
    growthfactor_split_early
    ;eboss16_elg_0
    ;eboss16_lrg_1
    ;eboss16_mgs
    eboss_rsd_lrg_mgs_qso_elg_gal
    ;eboss16_qso_1
timing=F
debug=F
extra_output = cosmological_parameters/sigma_8 cosmological_parameters/S_8 data_vector/2pt_chi2
values = examples/rsd_f_sigma8_split_values.ini

[output]
filename = output/chains/3-split/eboss_rsd_priors.txt

[test]
save_dir=output/bao
fatal_errors=T

[nautilus]
n_live = 1000
verbose = T
resume = T
; you can set this to T if you don't want 
privacy = F

[camb]
file = boltzmann/camb/camb_interface.py
mode = all
lmax = 2500          ;max ell to use for cmb calculation
feedback=0         ;amount of output to print
AccuracyBoost=1.0 ;CAMB accuracy boost parameter
do_tensors = F
do_lensing = F
NonLinear = none
zmin_background = 0.
zmax_background = 2.
; zmax is 100 for Euclid emulator.
nz_background = 201
use_ppf_w = T
kmin=1e-4
kmax = 50.0
kmax_extrapolate = 500.0
nk=700

[camb_split]
file = boltzmann/camb/camb_interface_split.py
mode = all
lmax = 2500          ;max ell to use for cmb calculation
feedback=0         ;amount of output to print
AccuracyBoost=1.0 ;CAMB accuracy boost parameter
do_tensors = F
do_lensing = F
NonLinear = pk
halofit_version = takahashi
zmin_background = 0.
zmax_background = 2.
; zmax is 100 for Euclid emulator.
nz_background = 201
use_ppf_w = T
kmin=1e-4
kmax = 50.0
kmax_extrapolate = 500.0
nk=700

[euclid_emulator]
file = structure/EuclidEmulator2/euclid_emulator2_interface.py

[euclid_emulator_split]
file = structure/EuclidEmulator2/euclid_emulator2_interface_split.py

[growthfactor_split_early]
file = structure/growth_factor/growthfactor_split_early.py

[consistency]
file = utility/consistency/consistency_interface.py

[consistency_split]
file = utility/consistency/consistency_interface_split.py

[boss_0]
